<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Óscar Curieses</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=Montserrat:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
:root{--fg:#000;--text:#6b6b6b;--head:#54595f;--soft:#f1f1ef;--pf:'Playfair Display',Georgia,serif;--ms:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-padding-top:24px;scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--fg);font:16px/1.8 var(--pf)}
a{color:#000;text-decoration:none}a:hover{color:#54595f}
.site{background:#fff;color:#000;font:16px/1.8 var(--pf);width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.col{max-width:692px;margin:0 auto}
.brand{text-align:center;padding:56px 0 40px}
.title{font:400 clamp(34px,6vw,48px)/1.3 var(--pf);letter-spacing:1px;margin:0}
.desc{font:400 11.2px var(--ms);letter-spacing:4px;text-transform:uppercase;margin:6px 0 0}
.bar{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;align-items:center;border-top:1px solid #000;border-bottom:1px solid #000;padding:0}
.burger{display:none}
.nav{display:flex;flex-wrap:wrap;justify-content:center;column-gap:0;align-self:stretch}
.nav a,.lang,.burger{font:400 11.2px var(--ms);letter-spacing:3px;text-transform:uppercase;line-height:44px;white-space:nowrap}
.nav a{display:flex;align-items:center;padding:0 26px;line-height:56px;border-left:1px solid transparent;border-right:1px solid transparent;transition:background-color .15s}
.nav a:hover,.nav a:focus-visible{background:#f1f1ef;border-left-color:#000;border-right-color:#000;color:#000;outline:none}
.lang{justify-self:end;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;line-height:1;border-left:1px solid #c9c9c9;padding-left:16px}
.sec{padding-top:72px}
.h1{font:400 35.2px/1.2 var(--pf);color:var(--head);text-align:center;margin:0 0 14px}
.h2{font:400 32px/1.2 var(--pf);color:#6b6b6b;text-align:center;margin:0 0 40px}
.h3{font:400 24px/1.3 var(--pf);color:var(--head);margin:22px 0 12px}
.kick{font:400 11.2px var(--ms);letter-spacing:3px;text-transform:uppercase;color:#6b6b6b;text-align:center;margin:0 0 22px}
.txt p{color:var(--text);font-size:17px;line-height:1.75;margin:0 0 14px}
.txt b{color:#000;font-weight:700}
.txt a{text-decoration:underline;color:var(--text)}
.feat{display:grid;gap:28px;justify-items:center;text-align:center}
.feat img{display:block;width:240px;height:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}
.more{font:400 11.2px var(--ms);letter-spacing:3px;text-transform:uppercase;color:#000;border:1px solid #000;padding:0 18px;line-height:42px;display:inline-block;margin-top:6px}
.more:hover{background:#000;color:#fff}
.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;row-gap:28px}
.bk{display:block;text-align:center}
.bk img{display:block;width:100%;aspect-ratio:862/1000;object-fit:contain;object-position:center bottom}
.bk p{font:400 13.6px/1.6 var(--pf);color:#6b6b6b;margin:8px 6px 0}
.rule{border:0;border-top:1px solid #000;margin:0}
.news{display:grid;gap:0}
.it{padding:36px 0;border-bottom:1px solid #000}
.it:first-child{padding-top:0}
.it img{display:block;width:100%;height:auto;margin-bottom:18px}
.bio{display:grid;gap:32px;align-items:center}
.bio img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;object-position:80% 30%}
.cred{font:400 9.6px var(--ms);letter-spacing:2px;text-transform:uppercase;color:#6b6b6b;margin-top:14px}
.foot{background:var(--soft);margin-top:112px;padding:64px 0 0}
.fbrand{text-align:center}
.fbrand .title{font-size:32px}
.fnav{display:flex;flex-wrap:wrap;justify-content:center;column-gap:40px;border-top:1px solid #000;border-bottom:1px solid #000;margin:32px 0 48px;padding:4px 0}
.fnav a{font:400 11.2px var(--ms);letter-spacing:3px;text-transform:uppercase;line-height:44px}
.fcols{display:grid;gap:36px;text-align:center}
.fcols h5{font:400 11.2px var(--ms);letter-spacing:3px;text-transform:uppercase;margin:0 0 14px}
.fcols p{font-size:15px;line-height:1.7;margin:0 0 6px;color:#3d3d3d}
.fcols a{text-decoration:underline}
.fbot{border-top:1px solid #000;margin-top:56px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 24px;padding:6px 0 18px;font:400 9.6px/1.8 var(--ms);letter-spacing:2px;text-transform:uppercase}
.fbot a{display:inline-flex;align-items:center;min-height:44px}
@media(max-width:759px){
.brand{padding:36px 0 28px}
.bar{grid-template-columns:minmax(0,1fr) auto;padding:0}
.sp{display:none}
.burger{display:inline-flex;align-items:center;gap:10px;justify-self:start;background:none;border:0;padding:0;min-height:44px;color:#000;cursor:pointer}
.nav{display:none;grid-column:1 / -1;grid-row:2;flex-direction:column;align-items:stretch;border-top:1px solid #c9c9c9;padding:0}
.nav.open{display:flex}
.nav a{justify-content:center;border-left:0;border-right:0;line-height:48px}
.nav a:hover,.nav a:focus-visible{border-left:0;border-right:0}
.fbot{justify-content:center;text-align:center}}
@media(min-width:760px){
.wrap{padding:0 40px}
.books{grid-template-columns:repeat(4,minmax(0,1fr));column-gap:32px;row-gap:40px}
.bio{grid-template-columns:240px 1fr;gap:40px}
.bio img{aspect-ratio:1/1}
.fcols{grid-template-columns:repeat(3,minmax(0,1fr))}}

.mob-only{display:none}
@media(max-width:759px){.mob-only{display:block}.desk-only{display:none}}
:focus-visible{outline:2px solid #000;outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="site"><header class="wrap"><div class="brand"><p class="title"><a href="/">Óscar Curieses</a></p><p class="desc">Web oficial</p></div></header>
<main class="wrap" id="top" style="text-align:center;padding:96px 20px 40px">
<h1 style="font:400 44px/1.2 var(--pf);color:#54595f;margin:0 0 16px">Página no encontrada</h1>
<p style="font:italic 400 19px/1.6 var(--pf);color:#6b6b6b;margin:0 0 32px">La página que buscas no existe o ha cambiado de dirección. · <span lang="en">This page does not exist or has moved.</span></p>
<p><a href="/" style="font:400 11.2px var(--ms);letter-spacing:3px;text-transform:uppercase;border:1px solid #000;padding:12px 20px">Ir al inicio</a> &nbsp; <a href="/libros/" style="font:400 11.2px var(--ms);letter-spacing:3px;text-transform:uppercase;border:1px solid #000;padding:12px 20px">Libros</a> &nbsp; <a href="/en/" lang="en" style="font:400 11.2px var(--ms);letter-spacing:3px;text-transform:uppercase;border:1px solid #000;padding:12px 20px">English</a></p>
</main>
</div>
</body>
</html>
